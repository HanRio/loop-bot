<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>플레이리스트</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px 16px 220px;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    font: 16px/1.4 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  h2 { margin: 20px 0 4px; font-size: 14px; font-weight: 600; color: var(--tg-theme-section-header-text-color, var(--tg-theme-hint-color, #888)); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 4px; min-height: 44px;
    border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
    background: var(--tg-theme-bg-color, #fff);
  }
  li.current .title { font-weight: 700; color: var(--tg-theme-button-color, #2481cc); }
  li.unplayable .title { opacity: .4; }
  .icon {
    flex: none; width: 44px; height: 44px; border: 0; background: none; padding: 0;
    color: var(--tg-theme-hint-color, #888); font-size: 20px; text-align: center; line-height: 44px;
  }
  button.icon:disabled { opacity: .3; }
  .handle { cursor: grab; user-select: none; touch-action: none; }
  .title {
    flex: 1; min-width: 0; min-height: 44px; padding: 0; border: 0; background: none; font: inherit;
    line-height: 44px; color: inherit; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .note { flex: none; font-size: 12px; color: var(--tg-theme-hint-color, #888); }
  .ghost { opacity: .4; }
  .empty { color: var(--tg-theme-hint-color, #888); padding: 12px 0; margin: 0; }
  .notice { color: #d33; margin: 0; }
  .notice:empty { display: none; }
  select, #new-name {
    width: 100%; min-height: 44px; padding: 10px; font: inherit; margin-top: 8px;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2); color: inherit;
    border: 0; border-radius: 8px;
  }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .buttons button {
    flex: 1; min-height: 44px; border: 0; border-radius: 8px; font: inherit; font-weight: 600;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2); color: var(--tg-theme-text-color, #000);
  }
  .buttons button.primary { background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .buttons button.danger { color: #d33; flex-basis: 100%; }
  button:disabled { opacity: .5; }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 16px env(safe-area-inset-bottom, 8px);
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    border-top: 1px solid var(--tg-theme-hint-color, #ccc);
  }
  #bar-top { display: flex; align-items: center; gap: 8px; }
  #now { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #time { flex: none; font-size: 13px; color: var(--tg-theme-hint-color, #888); font-variant-numeric: tabular-nums; }
  #seek { width: 100%; height: 44px; margin: 0; accent-color: var(--tg-theme-button-color, #2481cc); }
  #controls { display: flex; justify-content: space-around; align-items: center; }
  #controls button {
    min-width: 44px; min-height: 44px; border: 0; background: none; font-size: 22px;
    color: var(--tg-theme-text-color, #000);
  }
  #controls #toggle { font-size: 28px; }
  #repeat { position: relative; color: var(--tg-theme-hint-color, #888); }
  #repeat[data-mode="all"], #repeat[data-mode="one"] { color: var(--tg-theme-button-color, #2481cc); }
  #repeat[data-mode="one"]::after {
    content: "1"; position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 700;
  }
  #play-notice { min-height: 1.4em; margin: 0; font-size: 13px; color: #d33; }
</style>
</head>
<body>
<p id="fatal" class="empty" hidden></p>
<main id="app" hidden>
  <select id="picker" aria-label="플레이리스트 고르기"></select>
  <form id="new-form" hidden>
    <input id="new-name" maxlength="20" placeholder="플레이리스트 이름" aria-label="플레이리스트 이름" autocomplete="off">
    <div class="buttons">
      <button type="submit" class="primary">만들기</button>
      <button id="new-cancel" type="button">취소</button>
    </div>
  </form>
  <div id="save-notice" class="notice" role="alert"></div>
  <h2>재생 순서</h2>
  <ul id="queue"></ul>
  <p id="queue-empty" class="empty" hidden>아직 곡이 없어요. 아래 라이브러리에서 넣어보세요</p>
  <h2>라이브러리</h2>
  <ul id="library"></ul>
  <p id="library-empty" class="empty" hidden>라이브러리가 비었어요. 링크나 음원을 보내주세요</p>
  <div class="buttons">
    <button id="remove-playlist" class="danger" type="button">목록 삭제</button>
  </div>
  <p class="empty">링크는 채팅에 붙여넣으면 추가돼요. 긴 곡은 채팅에서 /play로 들어요</p>
</main>
<footer id="bar" hidden>
  <div id="bar-top">
    <span id="now"></span>
    <span id="time">0:00 / 0:00</span>
  </div>
  <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="재생 위치">
  <div id="controls">
    <button id="prev" type="button" aria-label="이전 곡">⏮</button>
    <button id="toggle" type="button" aria-label="재생">⏯</button>
    <button id="next" type="button" aria-label="다음 곡">⏭</button>
    <button id="repeat" type="button" aria-label="전체 반복">🔁</button>
  </div>
  <p id="play-notice" role="alert"></p>
</footer>
<script type="module" src="app.js"></script>
</body>
</html>
