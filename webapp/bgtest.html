<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>플레이어 시험</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000);
         font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; }
  button { width: 100%; min-height: 48px; margin: 6px 0; border: 0; border-radius: 10px; font-size: 16px;
           background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #fff); }
  .box { margin: 12px 0; padding: 12px; border-radius: 10px; background: var(--tg-theme-secondary-bg-color, #f2f2f2); }
  #log { font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--tg-theme-hint-color, #888); }
</style>
</head>
<body>
<div class="box" id="init"></div>
<p>1. 소리 켜기를 눌러요. 20초마다 음 높이가 바뀌어요.<br>2. 화면을 끄고 1분쯤 들어봐요.<br>3. 돌아와서 결과를 봐요.</p>
<button id="start">▶ 소리 켜기</button>
<div class="box" id="result">아직 시작하지 않았어요</div>
<div id="log"></div>
<script>
const FILES = ["bgtest.mp3", "bgtest2.mp3"];
const audio = new Audio();
const $ = (id) => document.getElementById(id);
const log = (m) => { $("log").textContent += new Date().toLocaleTimeString() + " " + m + "\n"; };
const tg = Telegram.WebApp;
let blobs = [], index = 0, hiddenSwitches = 0;

tg.ready();
$("init").textContent = "initData 길이: " + tg.initData.length + " / " + tg.platform + " / Bot API " + tg.version;

function setSession() {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({ title: "시험음 " + (index + 1), artist: "loop-bot" });
}
function playIndex(i) {
  index = i;
  audio.src = blobs[i];
  setSession();
  return audio.play();
}
audio.addEventListener("ended", () => {
  if (document.hidden) hiddenSwitches++;
  log("곡 끝, 다음 곡으로 (화면 " + (document.hidden ? "꺼짐" : "켜짐") + ")");
  playIndex((index + 1) % FILES.length).catch((e) => log("다음 곡 실패: " + e.message));
});
$("start").addEventListener("click", async () => {
  try {
    if (!blobs.length) {
      blobs = await Promise.all(FILES.map(async (f) => URL.createObjectURL(await (await fetch(f)).blob())));
    }
    hiddenSwitches = 0;
    await playIndex(0);
    log("재생 시작");
  } catch (e) { log("재생 실패: " + e.message); }
});
document.addEventListener("visibilitychange", () => {
  log(document.hidden ? "화면 벗어남" : "돌아옴");
  if (document.hidden) { hiddenSwitches = 0; return; }
  $("result").textContent = hiddenSwitches > 0
    ? "✅ 화면을 끈 동안 " + hiddenSwitches + "번 다음 곡으로 넘어갔어요"
    : "❌ 화면을 끈 동안 다음 곡으로 넘어가지 않았어요 (20초 넘게 기다렸는지 확인해 주세요)";
});
</script>
</body>
</html>
